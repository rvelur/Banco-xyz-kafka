server.port=8082
spring.application.name=transfer-service

# Variable dinámica de conexión a auth-service
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_SERVER_URL:http://localhost:9000}/oauth2/jwks

# Variable dinámica de conexión a account-service
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}

# ==========================================
# CONFIGURACIÓN DE APACHE KAFKA
# ==========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=banco-transfer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ==========================================
# RESILIENCE4J CONFIGURATION (Circuit Breaker)
# ==========================================
resilience4j.circuitbreaker.instances.accountServiceBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.accountServiceBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.accountServiceBreaker.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.accountServiceBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountServiceBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountServiceBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.accountServiceBreaker.automatic-transition-from-open-to-half-open-enabled=true