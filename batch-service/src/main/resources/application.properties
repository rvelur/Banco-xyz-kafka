spring.application.name=batch-service
server.port=8083

# Evita que Spring Batch intente arrancar todos los jobs juntos al iniciar
spring.batch.job.enabled=false

# Inicializacion de esquemas y tablas de Batch y JPA en H2
spring.batch.jdbc.initialize-schema=always
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Consola H2 para inspeccion si se requiere
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true