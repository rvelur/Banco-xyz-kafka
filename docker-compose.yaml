services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - banco-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "9000:9000"
    networks:
      - banco-network

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: account-service
    ports:
      - "8081:8081"
    environment:
      - AUTH_SERVER_URL=http://auth-service:9000
    depends_on:
      - auth-service
    networks:
      - banco-network

  transfer-service:
    build:
      context: ./transfer-service
      dockerfile: Dockerfile
    container_name: transfer-service
    ports:
      - "8082:8082"
    environment:
      - AUTH_SERVER_URL=http://auth-service:9000
      - ACCOUNT_SERVICE_URL=http://account-service:8081
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - auth-service
      - account-service
      - kafka
    networks:
      - banco-network

  batch-service:
    build:
      context: ./batch-service
      dockerfile: Dockerfile
    container_name: batch-service
    ports:
      - "8083:8083"
    networks:
      - banco-network

  bff-service:
    build:
      context: ./bff-service
      dockerfile: Dockerfile
    container_name: bff-service
    ports:
      - "8080:8080"
    environment:
      - SERVICES_ACCOUNT_URL=http://account-service:8081
      - SERVICES_TRANSFER_URL=http://transfer-service:8082
      - SERVICES_CUSTOMER_URL=http://customer-service:8084
      - SERVICES_AUTH_URL=http://auth-service:9000
    depends_on:
      - account-service
      - customer-service
    networks:
      - banco-network

  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    container_name: customer-service
    ports:
      - "8084:8084"
    networks:
      - banco-network

networks:
  banco-network:
    driver: bridge